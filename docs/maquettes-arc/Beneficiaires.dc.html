<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Commande · bénéficiaires</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Martian+Mono:wdth,wght@75..112.5,400..600&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F4F8}
a{color:#3A4276}a:hover{color:#1F2240}
</style>
</helmet>
<div style="position: relative; min-height: 1040px; background: #F4F4F8; font-family: Poppins, sans-serif; color: #1B1D30; font-size: 14px; line-height: 1.5; display: flex; flex-wrap: wrap; align-items: stretch; overflow: hidden">
<div style="flex: 0 0 248px; display: flex"><dc-import name="Sidebar" active="commandes" hint-size="248px,1040px"></dc-import></div>
<main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; padding: 36px 40px; display: flex; flex-direction: column; gap: 20px">
<span style="font-size: 13px; color: #63677F">Réseau</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-stretch: 92%; font-weight: 800; font-size: 40px; line-height: 1.05; color: #1F2240">Commandes</span>
<div style="height: 620px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E5EE"></div>
</main>

<div style="position: absolute; inset: 0; background: rgba(31,34,64,0.55); display: flex; align-items: center; justify-content: center; padding: 32px">
<div role="dialog" aria-modal="true" aria-labelledby="bf-title" style="width: 1080px; max-width: 100%; max-height: 900px; background: #FFFFFF; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 64px -12px rgba(31,34,64,0.30)">
<div style="padding: 24px 28px 16px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; border-bottom: 1px solid #ECEDF6">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 12px; color: #9A5B00">C202610161 · Jey · Hors évènement Urssaf</span>
<h2 id="bf-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; color: #1F2240">Bénéficiaires</h2>
</div>
<div style="display: flex; gap: 8px">
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #3A4276; font-family: Poppins, sans-serif; font-weight: 600; font-size: 13px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Recharger</button>
<button type="button" onClick="{{add}}" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: #3A4276; color: #FFFFFF; font-family: Poppins, sans-serif; font-weight: 600; font-size: 13px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ajouter un bénéficiaire</button>
</div>
</div>

<div style="flex: 1; overflow: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 13px">
<thead><tr style="background: #F9F9FC">
<th style="text-align: left; padding: 10px 12px 10px 28px; font-size: 12px; font-weight: 600; color: #545873">Prénom</th>
<th style="text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #545873">E-mail</th>
<th style="text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #545873">Mobile</th>
<th style="text-align: right; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #545873">Montant</th>
<th style="text-align: right; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #545873">Reste</th>
<th style="text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #545873">Statut</th>
<th style="text-align: right; padding: 10px 28px 10px 12px; font-size: 12px; font-weight: 600; color: #545873">Actions</th>
</tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<tr style="background: {{r.rowBg}}; opacity: {{r.opacity}}">
<td style="padding: 8px 12px 8px 28px; border-top: 1px solid #ECEDF6"><input type="text" aria-label="Prénom" value="{{r.first}}" readonly="{{r.locked}}" style="width: 100%; min-width: 110px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1.5px solid {{r.cellBorder}}; border-radius: 8px; background: {{r.cellBg}}; font-family: Poppins, sans-serif; font-size: 13px; text-decoration: {{r.strike}}"></td>
<td style="padding: 8px 12px; border-top: 1px solid #ECEDF6"><input type="email" aria-label="E-mail" value="{{r.mail}}" readonly="{{r.locked}}" style="width: 100%; min-width: 170px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1.5px solid {{r.cellBorder}}; border-radius: 8px; background: {{r.cellBg}}; font-family: Poppins, sans-serif; font-size: 13px; text-decoration: {{r.strike}}"></td>
<td style="padding: 8px 12px; border-top: 1px solid #ECEDF6"><input type="tel" aria-label="Mobile" value="{{r.mobile}}" readonly="{{r.locked}}" style="width: 100%; min-width: 120px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1.5px solid {{r.cellBorder}}; border-radius: 8px; background: {{r.cellBg}}; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 12px; text-decoration: {{r.strike}}"></td>
<td style="padding: 8px 12px; border-top: 1px solid #ECEDF6"><input type="text" aria-label="Montant" value="{{r.amount}}" readonly="{{r.locked}}" style="width: 96px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1.5px solid {{r.amountBorder}}; border-radius: 8px; background: {{r.cellBg}}; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 12px; text-align: right; text-decoration: {{r.strike}}"></td>
<td style="padding: 8px 12px; border-top: 1px solid #ECEDF6; text-align: right; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; color: #545873">{{r.rest}}</td>
<td style="padding: 8px 12px; border-top: 1px solid #ECEDF6"><span title="{{r.statusHint}}" style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: {{r.sBg}}; color: {{r.sFg}}; font-size: 12px; font-weight: 600; white-space: nowrap">{{r.status}}</span></td>
<td style="padding: 8px 28px 8px 12px; border-top: 1px solid #ECEDF6; text-align: right; white-space: nowrap">
<sc-if value="{{r.canRemove}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{r.toggle}}" aria-label="{{r.actionLabel}}" style="height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: {{r.actionFg}}; font-family: Poppins, sans-serif; font-weight: 600; font-size: 12px; cursor: pointer">{{r.actionText}}</button></sc-if>
<sc-if value="{{r.locked}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #63677F"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Attribué</span></sc-if>
</td>
</tr>
</sc-for>
</tbody>
</table>
</div>

<div style="padding: 16px 28px; border-top: 1px solid #ECEDF6; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: #F9F9FC">
<span style="font-size: 13px; color: #545873">{{summary}}</span>
<div style="display: flex; gap: 10px">
<button type="button" style="height: 44px; padding: 0 18px; border: 1.5px solid #CDCFDD; border-radius: 10px; background: #FFFFFF; color: #3A4276; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Fermer</button>
<button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #F8AA36; color: #1F2240; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Enregistrer</button>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { removed: { 4: true }, added: 1 };
  }
  renderVals() {
    const base = [
      { first: '[Prénom]', mail: '[e-mail]', mobile: '[mobile]', amount: '25,00', rest: '[reste]', kind: 'wait' },
      { first: '[Prénom]', mail: '[e-mail]', mobile: '[mobile]', amount: '25,00', rest: '[reste]', kind: 'wait' },
      { first: '[Prénom]', mail: '[e-mail]', mobile: '[mobile]', amount: '25,00', rest: '[reste]', kind: 'taken' },
      { first: '[Prénom]', mail: '[e-mail]', mobile: '[mobile]', amount: '25,00', rest: '[reste]', kind: 'wait' },
      { first: '[Prénom]', mail: '[e-mail]', mobile: '[mobile]', amount: '25,00', rest: '[reste]', kind: 'wait' }
    ];
    const news = Array.from({ length: this.state.added }, () => ({ first: '', mail: '', mobile: '', amount: '', rest: '—', kind: 'new' }));
    const all = [...base, ...news];
    const rows = all.map((r, i) => {
      const removed = !!this.state.removed[i];
      const locked = r.kind === 'taken';
      const isNew = r.kind === 'new';
      const st = removed ? { status: 'Retiré', sBg: '#FDEAF0', sFg: '#B3123F' }
        : locked ? { status: 'Attribué', sBg: '#ECEDF6', sFg: '#3A4276' }
        : isNew ? { status: 'Nouveau', sBg: '#FFF2DC', sFg: '#9A5B00' }
        : { status: 'En attente', sBg: '#EEEFF4', sFg: '#545873' };
      return {
        ...r, ...st, locked,
        statusHint: locked ? 'Ce bon est déjà attribué au compte de [compte].' : '',
        canRemove: !locked,
        rowBg: isNew ? '#FFFBF3' : '#FFFFFF',
        opacity: removed ? 0.6 : 1,
        strike: removed ? 'line-through' : 'none',
        cellBg: locked ? '#F5F5FA' : '#FFFFFF',
        cellBorder: locked ? '#F5F5FA' : '#E4E5EE',
        amountBorder: isNew && !r.amount ? '#E61B54' : (locked ? '#F5F5FA' : '#E4E5EE'),
        actionText: removed ? 'Annuler le retrait' : 'Retirer',
        actionLabel: removed ? 'Annuler le retrait' : 'Retirer ce bénéficiaire',
        actionFg: removed ? '#3A4276' : '#B3123F',
        toggle: () => this.setState({ removed: { ...this.state.removed, [i]: !removed } })
      };
    });
    const mods = Object.values(this.state.removed).filter(Boolean).length;
    return {
      rows,
      add: () => this.setState({ added: this.state.added + 1 }),
      summary: mods + ' modification(s), ' + this.state.added + ' ajout(s) · le montant doit être supérieur à 0.'
    };
  }
}
</script>
</body>
</html>
