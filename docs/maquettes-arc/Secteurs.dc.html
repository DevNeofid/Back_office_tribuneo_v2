<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Secteurs d'activité</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Martian+Mono:wdth,wght@75..112.5,400..600&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F4F8}
a{color:#3A4276}a:hover{color:#1F2240}
</style>
</helmet>
<div style="position: relative; min-height: 1040px; background: #F4F4F8; font-family: Poppins, sans-serif; color: #1B1D30; font-size: 14px; line-height: 1.5; display: flex; flex-wrap: wrap; align-items: stretch">
<div style="flex: 0 0 248px; display: flex"><dc-import name="Sidebar" active="secteurs" hint-size="248px,1040px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 36px 40px 24px; max-width: 1280px; box-sizing: border-box; width: 100%">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #63677F">Réseau</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-stretch: 92%; font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; color: #1F2240">Secteurs d'activité</h1>
</div>
</header>

<div style="padding: 0 40px 48px; max-width: 1000px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 16px">
<form onSubmit="{{add}}" style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: 18px 20px; background: #FFFFFF; border: 1px solid #E4E5EE; border-radius: 16px">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px">
<label for="sec-new" style="font-size: 13px; font-weight: 500; color: #31376A">Nouveau secteur d'activité</label>
<input id="sec-new" type="text" value="{{draft}}" onChange="{{onDraft}}" placeholder="Ex. Fromagerie" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: Poppins, sans-serif; font-size: 14px; color: #1B1D30; background: #FFFFFF">
</div>
<button type="submit" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #F8AA36; color: #1F2240; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ajouter</button>
</form>

<div style="background: #FFFFFF; border: 1px solid #E4E5EE; border-radius: 16px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid #ECEDF6">
<div style="display: flex; align-items: center; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600; color: #1F2240">Secteurs</h2>
<span style="padding: 1px 8px; border-radius: 999px; background: #ECEDF6; color: #3A4276; font-size: 12px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%">{{count}}</span>
</div>
<span style="font-size: 12px; color: #63677F">Ordre alphabétique · visibles par les clients</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
<sc-for list="{{sectors}}" as="s" hint-placeholder-count="11">
<div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px 6px 20px; border-bottom: 1px solid #ECEDF6; border-right: 1px solid #ECEDF6">
<span style="flex: 1; min-width: 0; font-weight: 500; color: #1F2240">{{s.name}}</span>
<sc-if value="{{s.dup}}" hint-placeholder-val="{{false}}">
<span style="padding: 2px 8px; border-radius: 999px; background: #FFF2DC; color: #9A5B00; font-size: 11px; font-weight: 600; white-space: nowrap">Doublon possible</span>
</sc-if>
<button type="button" onClick="{{s.ask}}" aria-label="Supprimer {{s.name}}" style="width: 36px; height: 36px; flex: 0 0 auto; border: 0; border-radius: 10px; background: transparent; color: #B3123F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
</div>
</sc-for>
</div>
</div>
</div>
</main>

<sc-if value="{{confirming}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: rgba(31,34,64,0.55); display: flex; align-items: center; justify-content: center; padding: 24px">
<div role="dialog" aria-modal="true" aria-labelledby="sec-dlg" style="width: 420px; max-width: 100%; background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 64px -12px rgba(31,34,64,0.30)">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #FDEAF0; color: #B3123F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h3 id="sec-dlg" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; color: #1F2240">Supprimer « {{pending}} » ?</h3>
<p style="margin: 0; font-size: 14px; color: #545873">Les partenaires rattachés à ce secteur le perdront. Cette action est définitive.</p>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px">
<button type="button" onClick="{{cancel}}" style="height: 44px; padding: 0 18px; border: 1.5px solid #CDCFDD; border-radius: 10px; background: #FFFFFF; color: #3A4276; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Annuler</button>
<button type="button" onClick="{{confirm}}" style="height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #E61B54; color: #FFFFFF; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Supprimer</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      pending: null,
      list: ['Alimentaire de proximité', 'Animalerie', 'Animalier', 'Articles pour fumeur', 'Arts et Culture', 'Assurance', 'Auto Moto et Cycles', 'Beauté et Bien-être', 'Bijouterie', 'Boucherie', 'Boulangerie']
    };
  }
  renderVals() {
    const list = [...this.state.list].sort((a, b) => a.localeCompare(b, 'fr'));
    const dups = new Set(['Animalerie', 'Animalier']);
    return {
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      add: (e) => {
        e.preventDefault();
        const v = this.state.draft.trim();
        if (v && this.state.list.indexOf(v) < 0) this.setState({ list: [...this.state.list, v], draft: '' });
      },
      count: String(list.length),
      sectors: list.map((name) => ({
        name,
        dup: dups.has(name) && this.state.list.indexOf('Animalerie') >= 0 && this.state.list.indexOf('Animalier') >= 0,
        ask: () => this.setState({ pending: name })
      })),
      confirming: this.state.pending !== null,
      pending: this.state.pending || '',
      cancel: () => this.setState({ pending: null }),
      confirm: () => this.setState({ list: this.state.list.filter((n) => n !== this.state.pending), pending: null })
    };
  }
}
</script>
</body>
</html>
