<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Partenaire · création en étapes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Martian+Mono:wdth,wght@75..112.5,400..600&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F4F8}
a{color:#3A4276}a:hover{color:#1F2240}
</style>
</helmet>
<div style="position: relative; min-height: 1040px; background: #F4F4F8; font-family: Poppins, sans-serif; color: #1B1D30; font-size: 14px; line-height: 1.5; display: flex; flex-wrap: wrap; align-items: stretch; overflow: hidden">
<div style="flex: 0 0 248px; display: flex"><dc-import name="Sidebar" active="partenaires" hint-size="248px,1040px"></dc-import></div>
<main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; padding: 36px 40px; display: flex; flex-direction: column; gap: 20px">
<span style="font-size: 13px; color: #63677F">Réseau</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-stretch: 92%; font-weight: 800; font-size: 40px; line-height: 1.05; color: #1F2240">Magasins partenaires</span>
<div style="height: 64px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E5EE"></div>
<div style="height: 120px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E5EE"></div>
<div style="height: 120px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E5EE"></div>
</main>

<div style="position: absolute; inset: 0; background: rgba(31,34,64,0.55); display: flex; align-items: center; justify-content: center; padding: 32px">
<div role="dialog" aria-modal="true" aria-labelledby="fp-title" style="width: 940px; max-width: 100%; min-height: 640px; background: #FFFFFF; border-radius: 24px; display: flex; flex-wrap: wrap; overflow: hidden; box-shadow: 0 24px 64px -12px rgba(31,34,64,0.30)">
<nav aria-label="Étapes" style="flex: 1 1 240px; max-width: 280px; background: #1F2240; padding: 28px 20px; display: flex; flex-direction: column; gap: 6px">
<span style="padding: 0 8px 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #8288BC">NOUVEAU PARTENAIRE</span>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<button type="button" onClick="{{s.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 8px; border: 0; border-radius: 12px; background: {{s.bg}}; color: {{s.fg}}; font-family: Poppins, sans-serif; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer">
<span style="width: 28px; height: 28px; flex: 0 0 auto; border-radius: 999px; background: {{s.dotBg}}; color: {{s.dotFg}}; display: flex; align-items: center; justify-content: center; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 12px; font-weight: 600">{{s.mark}}</span>
<span style="display: flex; flex-direction: column"><span>{{s.label}}</span><span style="font-size: 11px; color: {{s.subFg}}">{{s.sub}}</span></span>
</button>
</sc-for>
</nav>

<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column">
<div style="padding: 26px 30px 6px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 11px; color: #9A5B00">ÉTAPE {{stepNum}} / 5</span>
<h2 id="fp-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; color: #1F2240">{{stepTitle}}</h2>
</div>
<button type="button" aria-label="Fermer" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: #F5F5FA; color: #3A4276; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

<div style="flex: 1; padding: 18px 30px; display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{is1}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; color: #545873">On vérifie d'abord qu'aucune fiche n'utilise déjà ce SIRET.</p>
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 360px">
<label for="fp-siret" style="font-size: 13px; font-weight: 500; color: #31376A">SIRET</label>
<input id="fp-siret" type="text" placeholder="Entrer le SIRET" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 15px; color: #1B1D30">
</div>
<a href="VerifSiret.dc.html" style="font-size: 13px; font-weight: 600; text-decoration: none">Voir le cas « fiche existante »</a>
</sc-if>
<sc-if value="{{is2}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px">
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2"><label for="fp-name" style="font-size: 13px; font-weight: 500; color: #31376A">Nom du partenaire</label><input id="fp-name" type="text" placeholder="Nom du partenaire" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: Poppins, sans-serif; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-code" style="font-size: 13px; font-weight: 500; color: #31376A">Code du partenaire</label><input id="fp-code" type="text" placeholder="Ex. DEC09" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-siret2" style="font-size: 13px; font-weight: 500; color: #31376A">SIRET du partenaire</label><input id="fp-siret2" type="text" value="[SIRET saisi à l'étape 1]" readonly style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #E4E5EE; border-radius: 10px; background: #F5F5FA; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 13px; color: #545873"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-mail" style="font-size: 13px; font-weight: 500; color: #31376A">Email du partenaire</label><input id="fp-mail" type="email" placeholder="Email du partenaire" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: Poppins, sans-serif; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-tel" style="font-size: 13px; font-weight: 500; color: #31376A">Téléphone du partenaire</label><input id="fp-tel" type="tel" placeholder="Téléphone du partenaire" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
</div>
<button type="button" onClick="{{toggleDemat}}" aria-pressed="{{demat}}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1.5px solid #E4E5EE; border-radius: 14px; background: #F9F9FC; font-family: Poppins, sans-serif; text-align: left; cursor: pointer">
<span style="width: 40px; height: 22px; flex: 0 0 auto; border-radius: 999px; background: {{dematTrack}}; position: relative; display: inline-block"><span style="position: absolute; top: 3px; left: {{dematLeft}}; width: 16px; height: 16px; border-radius: 999px; background: {{dematKnob}}"></span></span>
<span style="display: flex; flex-direction: column"><span style="font-weight: 600; color: #1F2240">Accepte la dématérialisation</span><span style="font-size: 12px; color: #63677F">Le magasin accepte les bons sur mobile, pas seulement le papier.</span></span>
</button>
</sc-if>
<sc-if value="{{is3}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px">
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 3"><label for="fp-street" style="font-size: 13px; font-weight: 500; color: #31376A">Adresse</label><input id="fp-street" type="text" placeholder="Adresse" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: Poppins, sans-serif; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-zip" style="font-size: 13px; font-weight: 500; color: #31376A">Code postal</label><input id="fp-zip" type="text" placeholder="Code postal" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-city" style="font-size: 13px; font-weight: 500; color: #31376A">Ville</label><input id="fp-city" type="text" placeholder="Ville" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: Poppins, sans-serif; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-country" style="font-size: 13px; font-weight: 500; color: #31376A">Pays</label><input id="fp-country" type="text" value="France" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: Poppins, sans-serif; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-lat" style="font-size: 13px; font-weight: 500; color: #31376A">Latitude</label><input id="fp-lat" type="text" placeholder="Latitude" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-lng" style="font-size: 13px; font-weight: 500; color: #31376A">Longitude</label><input id="fp-lng" type="text" placeholder="Longitude" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
<div style="display: flex; align-items: flex-end"><a href="AjusterPosition.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #CDCFDD; color: #3A4276; font-weight: 600; font-size: 13px; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>Placer sur la carte</a></div>
</div>
</sc-if>
<sc-if value="{{is4}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px">
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2"><label for="fp-iban" style="font-size: 13px; font-weight: 500; color: #31376A">IBAN</label><input id="fp-iban" type="text" placeholder="FR76 …" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-bic" style="font-size: 13px; font-weight: 500; color: #31376A">BIC</label><input id="fp-bic" type="text" placeholder="BIC" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-bank" style="font-size: 13px; font-weight: 500; color: #31376A">Code établissement</label><input id="fp-bank" type="text" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-branch" style="font-size: 13px; font-weight: 500; color: #31376A">Code guichet</label><input id="fp-branch" type="text" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-key" style="font-size: 13px; font-weight: 500; color: #31376A">Clé RIB</label><input id="fp-key" type="text" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2"><label for="fp-acc" style="font-size: 13px; font-weight: 500; color: #31376A">Numéro de compte</label><input id="fp-acc" type="text" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fp-vat" style="font-size: 13px; font-weight: 500; color: #31376A">N° intracommunautaire</label><input id="fp-vat" type="text" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 3"><label for="fp-acct" style="font-size: 13px; font-weight: 500; color: #31376A">Numéro de compte comptabilité</label><input id="fp-acct" type="text" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 14px"></div>
</div>
</sc-if>
<sc-if value="{{is5}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; color: #545873">Sélectionnez les options qui s'appliquent.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{sectors}}" as="c" hint-placeholder-count="11">
<button type="button" onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1.5px solid {{c.border}}; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; font-family: Poppins, sans-serif; font-size: 13px; font-weight: 500; cursor: pointer">{{c.mark}}{{c.name}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 8px; align-items: flex-end; max-width: 460px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><label for="fp-newsec" style="font-size: 13px; font-weight: 500; color: #31376A">Secteur absent de la liste</label><input id="fp-newsec" type="text" placeholder="Nouveau secteur d'activité" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: Poppins, sans-serif; font-size: 14px"></div>
<button type="button" style="height: 40px; padding: 0 14px; border: 1.5px solid #CDCFDD; border-radius: 10px; background: #FFFFFF; color: #3A4276; font-family: Poppins, sans-serif; font-weight: 600; font-size: 13px; cursor: pointer">Créer</button>
</div>
</sc-if>
</div>

<div style="padding: 16px 30px; border-top: 1px solid #ECEDF6; display: flex; justify-content: space-between; gap: 10px; background: #F9F9FC">
<button type="button" onClick="{{prev}}" disabled="{{isFirst}}" style="height: 44px; padding: 0 18px; border: 1.5px solid #CDCFDD; border-radius: 10px; background: #FFFFFF; color: {{prevFg}}; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Précédent</button>
<button type="button" onClick="{{next}}" style="height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #F8AA36; color: #1F2240; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">{{nextLabel}}</button>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 2, demat: true, picked: { 'Beauté et Bien-être': true } };
  }
  renderVals() {
    const step = this.state.step;
    const defs = [
      ['SIRET', 'Vérifier les doublons'],
      ['Informations', 'Nom, contact, dématérialisation'],
      ['Adresse', 'Et position sur la carte'],
      ['Banque', 'Pour les virements'],
      ['Secteurs', "Secteurs d'activité"]
    ];
    const steps = defs.map(([label, sub], i) => {
      const n = i + 1, on = n === step, done = n < step;
      return {
        label, sub,
        mark: done ? '✓' : String(n),
        bg: on ? '#31376A' : 'transparent',
        fg: on || done ? '#FFFFFF' : '#B3B8DE',
        subFg: on ? '#D9DBEE' : '#8288BC',
        dotBg: on ? '#F8AA36' : (done ? '#14B946' : '#292D52'),
        dotFg: on || done ? '#1F2240' : '#B3B8DE',
        pick: () => this.setState({ step: n })
      };
    });
    const list = ['Alimentaire de proximité', 'Animalerie', 'Articles pour fumeur', 'Arts et Culture', 'Assurance', 'Auto Moto et Cycles', 'Beauté et Bien-être', 'Bijouterie', 'Boucherie', 'Boulangerie'];
    const sectors = list.map((name) => {
      const on = !!this.state.picked[name];
      return {
        name, on,
        mark: on ? '✓ ' : '',
        bg: on ? '#1F2240' : '#FFFFFF', fg: on ? '#FFFFFF' : '#31376A', border: on ? '#1F2240' : '#D9DBEE',
        toggle: () => this.setState({ picked: { ...this.state.picked, [name]: !on } })
      };
    });
    const d = this.state.demat;
    return {
      steps, sectors,
      stepNum: String(step),
      stepTitle: ['Rechercher un SIRET', 'Informations du partenaire', 'Adresse du magasin', 'Informations bancaires', "Secteurs d'activité"][step - 1],
      is1: step === 1, is2: step === 2, is3: step === 3, is4: step === 4, is5: step === 5,
      isFirst: step === 1,
      prevFg: step === 1 ? '#B3B8DE' : '#3A4276',
      nextLabel: step === 5 ? 'Créer le partenaire' : 'Suivant',
      prev: () => this.setState({ step: Math.max(1, step - 1) }),
      next: () => this.setState({ step: Math.min(5, step + 1) }),
      demat: d,
      dematTrack: d ? '#3A4276' : '#CDCFDD', dematKnob: d ? '#F8AA36' : '#FFFFFF', dematLeft: d ? '21px' : '3px',
      toggleDemat: () => this.setState({ demat: !d })
    };
  }
}
</script>
</body>
</html>
