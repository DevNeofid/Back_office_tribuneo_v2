<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Commande · nouvelle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Martian+Mono:wdth,wght@75..112.5,400..600&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F4F8}
a{color:#3A4276}a:hover{color:#1F2240}
</style>
</helmet>
<div style="position: relative; min-height: 1040px; background: #F4F4F8; font-family: Poppins, sans-serif; color: #1B1D30; font-size: 14px; line-height: 1.5; display: flex; flex-wrap: wrap; align-items: stretch; overflow: hidden">
<div style="flex: 0 0 248px; display: flex"><dc-import name="Sidebar" active="commandes" hint-size="248px,1040px"></dc-import></div>
<main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; padding: 36px 40px; display: flex; flex-direction: column; gap: 20px">
<span style="font-size: 13px; color: #63677F">Réseau</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-stretch: 92%; font-weight: 800; font-size: 40px; line-height: 1.05; color: #1F2240">Commandes</span>
<div style="height: 620px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E5EE"></div>
</main>

<div style="position: absolute; inset: 0; background: rgba(31,34,64,0.55); display: flex; justify-content: flex-end">
<aside role="dialog" aria-modal="true" aria-labelledby="fo-title" style="width: 660px; max-width: 100%; background: #FFFFFF; display: flex; flex-direction: column; box-shadow: 0 24px 64px -12px rgba(31,34,64,0.30)">
<div style="padding: 24px 28px 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; border-bottom: 1px solid #ECEDF6">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #9A5B00">NOUVELLE COMMANDE</span>
<h2 id="fo-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; color: #1F2240">Ajouter une commande</h2>
</div>
<button type="button" aria-label="Fermer" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: #F5F5FA; color: #3A4276; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

<div style="flex: 1; overflow-y: auto; padding: 22px 28px; display: flex; flex-direction: column; gap: 22px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px">
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2">
<label for="fo-by" style="font-size: 13px; font-weight: 500; color: #31376A">Offert par</label>
<div style="display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; color: #63677F">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
<input id="fo-by" type="search" placeholder="Rechercher une entité..." style="flex: 1; min-width: 0; border: 0; outline: none; font-family: Poppins, sans-serif; font-size: 14px; background: transparent">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fo-event" style="font-size: 13px; font-weight: 500; color: #31376A">Pour l'occasion de</label>
<select id="fo-event" style="height: 44px; padding: 0 10px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: Poppins, sans-serif; font-size: 14px; color: #1B1D30; background: #FFFFFF">
<option>Choisir l'occasion (URSSAF)</option>
<option>Départ à la retraite</option>
<option>Fête des mères</option>
<option>Hors évènement Urssaf</option>
<option>Naissance</option>
<option>Noël des salariés</option>
<option>Saint-Nicolas</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fo-exp" style="font-size: 13px; font-weight: 500; color: #31376A">Date d'expiration</label>
<div style="display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; color: #3A4276">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
<input id="fo-exp" type="text" placeholder="Jour/Mois/Année" style="flex: 1; min-width: 0; border: 0; outline: none; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 13px; background: transparent">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2">
<label for="fo-custom" style="font-size: 13px; font-weight: 500; color: #31376A">Personnalisation « offert par » <span style="font-weight: 400; color: #63677F">(optionnel)</span></label>
<input id="fo-custom" type="text" placeholder="Ex. Le CSE de [entreprise]" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: Poppins, sans-serif; font-size: 14px">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<h3 style="margin: 0; font-size: 15px; font-weight: 600; color: #1F2240">Bons cadeaux</h3>
<div role="tablist" style="display: inline-flex; padding: 3px; gap: 3px; border-radius: 10px; background: #ECEDF6">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" role="tab" onClick="{{m.pick}}" style="height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: {{m.bg}}; color: {{m.fg}}; box-shadow: {{m.shadow}}; font-family: Poppins, sans-serif; font-weight: 600; font-size: 12px; cursor: pointer">{{m.label}}</button>
</sc-for>
</div>
</div>

<sc-if value="{{isManual}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
<div style="display: grid; grid-template-columns: 130px 110px minmax(0, 1fr) 36px; gap: 10px; align-items: end; padding: 12px; border-radius: 14px; background: #F5F5FA; border: 1px solid #E4E5EE">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="{{l.amountId}}" style="font-size: 12px; font-weight: 500; color: #31376A">Montant par chèque</label><input id="{{l.amountId}}" type="text" inputmode="decimal" value="{{l.amount}}" onChange="{{l.onAmount}}" placeholder="0,00 €" style="height: 40px; box-sizing: border-box; padding: 0 10px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 13px; background: #FFFFFF"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="{{l.qtyId}}" style="font-size: 12px; font-weight: 500; color: #31376A">Nombre de chèques</label><input id="{{l.qtyId}}" type="text" inputmode="numeric" value="{{l.qty}}" onChange="{{l.onQty}}" placeholder="0" style="height: 40px; box-sizing: border-box; padding: 0 10px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 13px; background: #FFFFFF"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="{{l.msgId}}" style="font-size: 12px; font-weight: 500; color: #31376A">Message personnalisé</label><input id="{{l.msgId}}" type="text" placeholder="Message personnalisé" style="height: 40px; box-sizing: border-box; padding: 0 10px; border: 1.5px solid #CDCFDD; border-radius: 10px; font-family: Poppins, sans-serif; font-size: 13px; background: #FFFFFF"></div>
<button type="button" onClick="{{l.remove}}" aria-label="Retirer la ligne" style="width: 36px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #B3123F; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
</div>
</sc-for>
<button type="button" onClick="{{addLine}}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1.5px dashed #8288BC; border-radius: 10px; background: #FFFFFF; color: #3A4276; font-family: Poppins, sans-serif; font-weight: 600; font-size: 13px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ajouter un autre montant</button>
</div>
</sc-if>
<sc-if value="{{isImport}}" hint-placeholder-val="{{false}}">
<div style="border: 2px dashed #B3B8DE; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="width: 48px; height: 48px; border-radius: 14px; background: #FFF7EB; color: #9A5B00; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 8a4 4 0 0 1-.5 8H16"/><path d="M12 20v-8M9 15l3-3 3 3"/></svg></span>
<button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #3A4276; color: #FFFFFF; font-family: Poppins, sans-serif; font-weight: 600; font-size: 13px; cursor: pointer">Importer CSV/XLSX</button>
<span style="font-size: 13px; color: #63677F">Aucun fichier sélectionné · une ligne par bénéficiaire, montants libres</span>
</div>
</sc-if>
</div>
</div>

<div style="padding: 16px 28px; border-top: 1px solid #ECEDF6; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: #F9F9FC">
<div style="display: flex; flex-direction: column">
<span style="font-size: 12px; color: #63677F">{{summary}}</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: #1F2240">{{total}}</span>
</div>
<div style="display: flex; gap: 10px">
<button type="button" style="height: 44px; padding: 0 18px; border: 1.5px solid #CDCFDD; border-radius: 10px; background: #FFFFFF; color: #3A4276; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Annuler</button>
<button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #F8AA36; color: #1F2240; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Enregistrer</button>
</div>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'manual', lines: [{ id: 1, amount: '', qty: '' }], nextId: 2 };
  }
  renderVals() {
    const num = (s) => { const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
    const upd = (id, key) => (e) => this.setState({ lines: this.state.lines.map((l) => l.id === id ? { ...l, [key]: e.target.value } : l) });
    const lines = this.state.lines.map((l) => ({
      ...l,
      amountId: 'fo-a' + l.id, qtyId: 'fo-q' + l.id, msgId: 'fo-m' + l.id,
      onAmount: upd(l.id, 'amount'), onQty: upd(l.id, 'qty'),
      remove: () => this.setState({ lines: this.state.lines.length > 1 ? this.state.lines.filter((x) => x.id !== l.id) : this.state.lines })
    }));
    const qty = this.state.lines.reduce((s, l) => s + num(l.qty), 0);
    const total = this.state.lines.reduce((s, l) => s + num(l.amount) * num(l.qty), 0);
    const modes = [{ id: 'manual', label: 'Saisie manuelle' }, { id: 'import', label: 'Importer un fichier' }].map((m) => {
      const on = this.state.mode === m.id;
      return { ...m, bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#1F2240' : '#545873', shadow: on ? '0 1px 3px rgba(31,34,64,0.15)' : 'none', pick: () => this.setState({ mode: m.id }) };
    });
    const manual = this.state.mode === 'manual';
    return {
      modes, lines,
      isManual: manual, isImport: !manual,
      addLine: () => this.setState({ lines: [...this.state.lines, { id: this.state.nextId, amount: '', qty: '' }], nextId: this.state.nextId + 1 }),
      summary: manual ? qty + ' bon(s) · total de la commande' : 'Total calculé depuis le fichier',
      total: manual ? total.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €' : '—'
    };
  }
}
</script>
</body>
</html>
