<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Écritures comptables</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Martian+Mono:wdth,wght@75..112.5,400..600&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F4F8}
a{color:#3A4276}a:hover{color:#1F2240}
</style>
</helmet>
<div style="position: relative; min-height: 1040px; background: #F4F4F8; font-family: Poppins, sans-serif; color: #1B1D30; font-size: 14px; line-height: 1.5; display: flex; flex-wrap: wrap; align-items: stretch">
<div style="flex: 0 0 248px; display: flex"><dc-import name="Sidebar" active="ecritures" hint-size="248px,1040px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 36px 40px 24px; max-width: 1280px; box-sizing: border-box; width: 100%">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #63677F">Finance</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-stretch: 92%; font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; color: #1F2240">Écritures comptables</h1>
</div>
</header>

<div style="padding: 0 40px 48px; max-width: 1280px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 22px 24px; border-radius: 18px; background: #1F2240; color: #FFFFFF">
<span style="width: 48px; height: 48px; flex: 0 0 auto; border-radius: 14px; background: #31376A; color: #F8AA36; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/></svg></span>
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #B3B8DE">PROCHAINE PÉRIODE</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">Du 12/10/2026 au 04/11/2026</span>
<span style="font-size: 13px; color: #D9DBEE">Reprend là où s'arrête le dernier fichier (11/10/2026).</span>
</div>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #F8AA36; color: #1F2240; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>Déclencher les écritures comptables</button>
</div>

<div style="background: #FFFFFF; border: 1px solid #E4E5EE; border-radius: 16px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #ECEDF6">
<div style="display: flex; align-items: center; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600; color: #1F2240">Fichiers générés</h2>
<span style="padding: 1px 8px; border-radius: 999px; background: #ECEDF6; color: #3A4276; font-size: 12px; font-family: 'Martian Mono', monospace; font-stretch: 87.5%">131</span>
</div>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 13px">
<thead><tr style="background: #F9F9FC">
<th style="text-align: left; padding: 10px 20px; font-size: 12px; font-weight: 600; color: #545873">Période couverte</th>
<th style="text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #545873; width: 22%">Durée</th>
<th style="text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #545873">Fichier</th>
<th style="text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #545873">Généré le</th>
<th style="text-align: right; padding: 10px 20px; font-size: 12px; font-weight: 600; color: #545873">Télécharger</th>
</tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<tr>
<td style="padding: 12px 20px; border-top: 1px solid #ECEDF6; white-space: nowrap; font-weight: 500; color: #1F2240">{{r.period}}</td>
<td style="padding: 12px; border-top: 1px solid #ECEDF6"><div style="display: flex; align-items: center; gap: 10px"><div style="flex: 1; height: 6px; border-radius: 999px; background: #F5F5FA"><div style="height: 6px; border-radius: 999px; width: {{r.w}}; background: #8288BC"></div></div><span style="font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 11px; color: #545873; width: 36px; text-align: right">{{r.days}}</span></div></td>
<td style="padding: 12px; border-top: 1px solid #ECEDF6; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 11px; color: #545873">{{r.file}}</td>
<td style="padding: 12px; border-top: 1px solid #ECEDF6; color: #545873; white-space: nowrap">{{r.created}}</td>
<td style="padding: 8px 20px; border-top: 1px solid #ECEDF6; text-align: right"><button type="button" aria-label="Télécharger {{r.file}}" style="width: 34px; height: 34px; border: 0; border-radius: 9px; background: #F5F5FA; color: #3A4276; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 6px; padding: 12px 20px; font-size: 12px; color: #545873; border-top: 1px solid #ECEDF6">
<span style="font-family: 'Martian Mono', monospace; font-stretch: 87.5%">1–10 sur 131</span>
<button type="button" aria-label="Page précédente" disabled style="width: 32px; height: 32px; border: 1px solid #E4E5EE; border-radius: 8px; background: #FFFFFF; color: #B3B8DE">‹</button>
<button type="button" aria-label="Page suivante" style="width: 32px; height: 32px; border: 1px solid #CDCFDD; border-radius: 8px; background: #FFFFFF; color: #3A4276; cursor: pointer">›</button>
</div>
</div>
</div>
</main>
<button type="button" aria-label="Ouvrir Néo" style="position: absolute; right: 28px; bottom: 28px; width: 60px; height: 60px; border: 0; border-radius: 999px; background: #FFFFFF; box-shadow: 0 8px 24px -6px rgba(31,34,64,0.35), 0 0 0 1px #E4E5EE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg viewBox="0 0 538.51 404.05" width="34" height="26" aria-hidden="true"><path d="m51.56,99.39c-.47,35.83-.91,71.89-.03,107.71.94,37.89,14.49,74.43,40.64,102.21,53.42,56.73,145.42,58.3,201.55,4.47,30.66-29.41,46.36-71.5,46.14-113.73" fill="none" stroke="#3A4276" stroke-linecap="round" stroke-linejoin="round" stroke-width="102.04"/><path d="m486.95,304.66c.47-35.83.91-71.89.03-107.71-.94-37.89-14.49-74.43-40.64-102.21-53.42-56.73-145.42-58.3-201.55-4.47-30.66,29.41-46.36,71.5-46.14,113.73" fill="none" stroke="#F8AA36" stroke-linecap="round" stroke-linejoin="round" stroke-width="102.04"/></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['2026-10-08', '2026-10-11', '12/10/2026'],
      ['2026-08-28', '2026-10-07', '08/10/2026'],
      ['2026-04-17', '2026-08-27', '28/08/2026'],
      ['2026-04-13', '2026-04-16', '17/04/2026'],
      ['2026-03-31', '2026-04-12', '13/04/2026'],
      ['2026-03-24', '2026-03-30', '31/03/2026'],
      ['2026-03-12', '2026-03-23', '24/03/2026'],
      ['2026-03-05', '2026-03-11', '12/03/2026'],
      ['2026-03-03', '2026-03-04', '05/03/2026'],
      ['2026-02-09', '2026-03-02', '03/03/2026']
    ];
    const months = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
    const fmt = (iso) => { const [y, m, d] = iso.split('-').map(Number); return d + ' ' + months[m - 1]; };
    const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000) + 1;
    const max = Math.max(...raw.map(([a, b]) => days(a, b)));
    const rows = raw.map(([a, b, created]) => {
      const n = days(a, b);
      return {
        period: fmt(a) + ' → ' + fmt(b) + ' ' + a.slice(0, 4),
        days: n + ' j',
        w: Math.max(n / max * 100, 3).toFixed(1) + '%',
        file: 'ECRITURES_' + a + '_' + b + '.zip',
        created
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
