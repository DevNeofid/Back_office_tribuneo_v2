<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Client · ajouter ou modifier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Martian+Mono:wdth,wght@75..112.5,400..600&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F4F8}
a{color:#3A4276}a:hover{color:#1F2240}
</style>
</helmet>
<div style="position: relative; min-height: 1040px; background: #F4F4F8; font-family: Poppins, sans-serif; color: #1B1D30; font-size: 14px; line-height: 1.5; display: flex; flex-wrap: wrap; align-items: stretch; overflow: hidden">
<div style="flex: 0 0 248px; display: flex"><dc-import name="Sidebar" active="clients" hint-size="248px,1040px"></dc-import></div>
<main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; padding: 36px 40px; display: flex; flex-direction: column; gap: 20px">
<span style="font-size: 13px; color: #63677F">Réseau</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-stretch: 92%; font-weight: 800; font-size: 40px; line-height: 1.05; color: #1F2240">Clients</span>
<div style="height: 64px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E5EE"></div>
<div style="height: 560px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E5EE"></div>
</main>

<div style="position: absolute; inset: 0; background: rgba(31,34,64,0.55); display: flex; justify-content: flex-end">
<aside role="dialog" aria-modal="true" aria-labelledby="fc-title" style="width: 600px; max-width: 100%; background: #FFFFFF; display: flex; flex-direction: column; box-shadow: 0 24px 64px -12px rgba(31,34,64,0.30)">
<div style="padding: 24px 28px 16px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #ECEDF6">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #9A5B00">{{eyebrow}}</span>
<h2 id="fc-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15; color: #1F2240">{{title}}</h2>
</div>
<button type="button" aria-label="Fermer" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: #F5F5FA; color: #3A4276; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<nav aria-label="Sections" style="display: flex; gap: 4px">
<a href="#fc-id" style="padding: 6px 12px; border-radius: 999px; background: #1F2240; color: #FFFFFF; font-size: 12px; font-weight: 600; text-decoration: none">Identité</a>
<a href="#fc-addr" style="padding: 6px 12px; border-radius: 999px; background: #F5F5FA; color: #31376A; font-size: 12px; font-weight: 600; text-decoration: none">Adresse</a>
<a href="#fc-bank" style="padding: 6px 12px; border-radius: 999px; background: #F5F5FA; color: #31376A; font-size: 12px; font-weight: 600; text-decoration: none">Banque</a>
</nav>
<div role="group" aria-label="Mode de la maquette" style="display: inline-flex; padding: 3px; gap: 3px; border-radius: 10px; background: #ECEDF6">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" onClick="{{m.pick}}" style="height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: {{m.bg}}; color: {{m.fg}}; font-family: Poppins, sans-serif; font-weight: 600; font-size: 11px; cursor: pointer">{{m.label}}</button>
</sc-for>
</div>
</div>
</div>

<div style="flex: 1; overflow-y: auto; padding: 22px 28px; display: flex; flex-direction: column; gap: 26px">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<section id="{{s.id}}" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #ECEDF6; color: #3A4276; display: flex; align-items: center; justify-content: center; font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 12px; font-weight: 600">{{s.num}}</span>
<h3 style="margin: 0; font-size: 15px; font-weight: 600; color: #1F2240">{{s.title}}</h3>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px">
<sc-for list="{{s.fields}}" as="f" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: {{f.span}}">
<label for="{{f.id}}" style="font-size: 13px; font-weight: 500; color: #31376A">{{f.label}}</label>
<input id="{{f.id}}" type="text" value="{{f.value}}" onChange="{{f.onChange}}" placeholder="{{f.placeholder}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid {{f.border}}; border-radius: 10px; font-family: {{f.font}}; font-stretch: {{f.stretch}}; font-size: 14px; color: #1B1D30; background: #FFFFFF">
<sc-if value="{{f.hasError}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #B3123F">{{f.error}}</span></sc-if>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>

<div style="padding: 16px 28px; border-top: 1px solid #ECEDF6; display: flex; justify-content: flex-end; gap: 10px; background: #F9F9FC">
<button type="button" style="height: 44px; padding: 0 18px; border: 1.5px solid #CDCFDD; border-radius: 10px; background: #FFFFFF; color: #3A4276; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Annuler</button>
<button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #F8AA36; color: #1F2240; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">{{submitLabel}}</button>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'edit', values: {} };
  }
  renderVals() {
    const edit = this.state.mode === 'edit';
    const prefill = edit ? {
      name: "A L'INSTITUT - AS SAUNIER", email: 'ascoudair@orange.fr', phone: '0492341841', siret: '82461449900013',
      iban: 'FR76 [IBAN]'
    } : {};
    const mono = ['siret', 'phone', 'zip', 'lat', 'lng', 'iban', 'bic', 'bank_code', 'branch_code', 'account', 'key', 'vat', 'accounting'];
    const def = (id, label, placeholder, span) => {
      const v = this.state.values[id] !== undefined ? this.state.values[id] : (prefill[id] || '');
      let error = '';
      if (id === 'iban' && v && !/^FR76/.test(v.replace(/\s/g, ''))) error = 'IBAN invalide';
      if (id === 'siret' && v && v.replace(/\s/g, '').length !== 14) error = 'Le SIRET compte 14 chiffres.';
      const isMono = mono.indexOf(id) >= 0;
      return {
        id: 'fc-' + id, label, placeholder, value: v,
        span: span ? 'span 2' : 'auto',
        hasError: !!error, error,
        border: error ? '#E61B54' : '#CDCFDD',
        font: isMono ? "'Martian Mono', monospace" : 'Poppins, sans-serif',
        stretch: isMono ? '87.5%' : '100%',
        onChange: (e) => this.setState({ values: { ...this.state.values, [id]: e.target.value } })
      };
    };
    const sections = [
      { id: 'fc-id', num: '1', title: 'Identité', fields: [
        def('name', 'Nom du client', 'Nom du client', true),
        def('code', 'Code du client', 'Code du client'),
        def('siret', 'SIRET du client', '14 chiffres'),
        def('email', 'Email du client', 'Email du client'),
        def('phone', 'Téléphone du client', 'Téléphone du client')
      ] },
      { id: 'fc-addr', num: '2', title: 'Adresse', fields: [
        def('street', 'Adresse', 'Adresse', true),
        def('zip', 'Code postal', 'Code postal'),
        def('city', 'Ville', 'Ville'),
        def('country', 'Pays', 'Pays'),
        def('lat', 'Latitude', 'Latitude'),
        def('lng', 'Longitude', 'Longitude')
      ] },
      { id: 'fc-bank', num: '3', title: 'Informations bancaires', fields: [
        def('iban', 'IBAN', 'FR76 …', true),
        def('bic', 'BIC', 'BIC'),
        def('key', 'Clé RIB', 'Clé RIB'),
        def('bank_code', 'Code établissement', 'Code établissement'),
        def('branch_code', 'Code guichet', 'Code guichet'),
        def('account', 'Numéro de compte', 'Numéro de compte'),
        def('vat', 'Numéro intracommunautaire', 'Numéro intracommunautaire'),
        def('accounting', 'Numéro de compte comptabilité', 'Numéro de compte comptabilité', true)
      ] }
    ];
    const modes = [{ id: 'add', label: 'Ajout' }, { id: 'edit', label: 'Modification' }].map((m) => {
      const on = this.state.mode === m.id;
      return { ...m, bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#1F2240' : '#545873', pick: () => this.setState({ mode: m.id, values: {} }) };
    });
    return {
      sections, modes,
      eyebrow: edit ? 'MODIFIER LE CLIENT' : 'NOUVEAU CLIENT',
      title: edit ? "A L'INSTITUT - AS SAUNIER" : 'Ajouter un client',
      submitLabel: edit ? 'Enregistrer les modifications' : 'Ajouter le client'
    };
  }
}
</script>
</body>
</html>
