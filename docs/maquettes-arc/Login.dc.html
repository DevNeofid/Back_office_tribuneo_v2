<div style="position: relative; display: flex; flex-direction: column; gap: 12px; max-width: 440px">
<span style="font-family: 'Martian Mono', monospace; font-stretch: 87.5%; font-size: 11px; letter-spacing: 0.12em; color: #8288BC">BACKOFFICE</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-stretch: 92%; font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -0.02em; color: #FFFFFF">L'espace de gestion du réseau Tribuneo</span>
</div>
</section>

<section style="flex: 1 1 480px; display: flex; align-items: center; justify-content: center; padding: 48px 24px; box-sizing: border-box">
<form onSubmit="{{submit}}" style="width: 400px; max-width: 100%; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-stretch: 92%; font-weight: 800; font-size: 36px; line-height: 1.1; color: #1F2240">Connexion</h1>
<span style="color: #545873">Réservée aux comptes administrateurs.</span>
</div>
<sc-if value="{{denied}}" hint-placeholder-val="{{false}}">
<div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #FDEAF0; border: 1px solid #F7B9CB; color: #B3123F; font-size: 13px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>
<span>Erreur de connexion. Veuillez vérifier vos identifiants.</span>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="lg-user" style="font-size: 13px; font-weight: 500; color: #31376A">Nom d'utilisateur</label>
<div style="display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid {{userBorder}}; border-radius: 10px; background: #FFFFFF; color: #8288BC">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
<input id="lg-user" type="text" autocomplete="username" value="{{user}}" onChange="{{onUser}}" style="flex: 1; min-width: 0; border: 0; outline: none; font-family: Poppins, sans-serif; font-size: 15px; color: #1B1D30; background: transparent">
</div>
<sc-if value="{{userError}}" hint-placeholder-val="{{false}}">
<span style="font-size: 12px; color: #B3123F">Entrez un identifiant valide</span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="lg-pass" style="font-size: 13px; font-weight: 500; color: #31376A">Mot de passe</label>
<div style="display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 6px 0 14px; border: 1.5px solid #CDCFDD; border-radius: 10px; background: #FFFFFF; color: #8288BC">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
<input id="lg-pass" type="{{passType}}" autocomplete="current-password" style="flex: 1; min-width: 0; border: 0; outline: none; font-family: Poppins, sans-serif; font-size: 15px; color: #1B1D30; background: transparent">
<button type="button" onClick="{{toggleShow}}" aria-label="{{showLabel}}" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #3A4276; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
</div>
<button type="submit" style="height: 48px; border: 0; border-radius: 10px; background: #F8AA36; color: #1F2240; font-family: Poppins, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">Se connecter</button>
<span style="font-size: 12px; color: #63677F; text-align: center">Un compte non administrateur est refusé : « Accès refusé : votre compte n'est pas un compte administrateur. »</span>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { user: 'cci04admin', show: false, tried: false, denied: false };
  }
  renderVals() {
    const userError = this.state.tried && !this.state.user.trim();
    return {
      user: this.state.user,
      onUser: (e) => this.setState({ user: e.target.value }),
      userError,
      userBorder: userError ? '#E61B54' : '#CDCFDD',
      denied: this.state.denied,
      passType: this.state.show ? 'text' : 'password',
      showLabel: this.state.show ? 'Masquer le mot de passe' : 'Afficher le mot de passe',
      toggleShow: () => this.setState({ show: !this.state.show }),
      submit: (e) => { e.preventDefault(); this.setState({ tried: true, denied: !!this.state.user.trim() }); }
    };
  }
}
</script>
</body>
</html>
